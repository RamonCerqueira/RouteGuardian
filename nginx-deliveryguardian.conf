# Arquivo de configuração Nginx para a VPS Interservice
# Domínio: deliveryguardian.genioplay.com.br
# Porta da Aplicação Next.js: 7171

server {
    listen 80;
    listen [::]:80;
    server_name deliveryguardian.genioplay.com.br;

    # Redireciona HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deliveryguardian.genioplay.com.br;

    # Certificados SSL (Gerados via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/deliveryguardian.genioplay.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/deliveryguardian.genioplay.com.br/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:7171;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
